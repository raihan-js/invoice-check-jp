[project]
name = "invoicecheck"
version = "0.1.0"
description = "Japanese qualified-invoice extraction verified against the NTA registry, check digits and tax arithmetic"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
